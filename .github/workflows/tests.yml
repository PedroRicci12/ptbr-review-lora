name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      # Python version from .python-version; exact package versions from uv.lock (fails if stale).
      - name: Install dependencies
        run: uv sync --locked

      # Unit tests only: no GPU, no dataset download.
      - name: Run tests
        run: uv run pytest -q
