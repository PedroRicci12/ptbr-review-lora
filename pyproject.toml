[project]
name = "ptbr-review-lora"
version = "0.1.0"
description = "QLoRA fine-tuning of a small LLM (1B-3B) for Brazilian Portuguese review sentiment classification."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ptbr_review_lora"]

[tool.pytest.ini_options]
testpaths = ["tests"]
